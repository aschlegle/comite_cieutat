<div class="container pile">

  <section class="etiquette etiquette--titre centre">
    <p class="surtitre">Fête de Cieutat</p>
    <h1>Galerie</h1>
    <p class="dates">Les visuels de l'édition 2026 et des années passées</p>
  </section>

  <section class="etiquette">
    <div class="images">
      <figure *ngFor="let image of displayedImages" class="image">
        <div class="cadre">
          <img [src]="image.src" [alt]="image.title" loading="lazy">
        </div>
        <figcaption>
          <h3>{{ image.title }}</h3>
          <p>{{ image.description }}</p>
        </figcaption>
      </figure>
    </div>

    <div class="centre plus" *ngIf="hasMoreImages">
      <button mat-raised-button color="primary" (click)="loadMoreImages()">
        Voir plus d'images
      </button>
    </div>
  </section>

</div>
